user  nginx;
worker_processes  1;

events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    client_max_body_size 100M;

    map $http_x_real_ip $client_ip {
        default $http_x_real_ip;
        ""      $remote_addr;
    }

    server {
            listen 10001;
            index index.php index.html index.htm default.php default.htm default.html;
            root /usr/share/nginx/html/wap-vue;

            location /api/api/ {
                proxy_pass http://trading-order-admin:8111/api/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $client_ip;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }

            location / {
               try_files $uri $uri/ /index.html;
            }

               location ~ /\.ht {
                deny all;
            }

            location ~ ^/(application|runtime|config|vendor)/ {
                deny all;
                return 404;
            }
    }


    server {
            listen 10002;
            index index.php index.html index.htm default.php default.htm default.html;
            root /usr/share/nginx/html/web-vue;

            location /api {
                proxy_pass http://trading-order-admin:8111;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $client_ip;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }

            location / {
               try_files $uri $uri/ /index.html;
            }

               location ~ /\.ht {
                deny all;
            }

            location ~ ^/(application|runtime|config|vendor)/ {
                deny all;
                return 404;
            }
    }


    server {
                listen 10003;
                index index.php index.html index.htm default.php default.htm default.html;
                root /usr/share/nginx/html/admin-vue;

                location /api/ {
                    proxy_pass http://trading-order-admin:8111/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $client_ip;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                }

                location / {
                   try_files $uri $uri/ /index.html;
                }

                   location ~ /\.ht {
                    deny all;
                }

                location ~ ^/(application|runtime|config|vendor)/ {
                    deny all;
                    return 404;
                }
        }
}
    #$client_ip 客户端请求ip 替换 $remote_addr