# 定义网络配置
networks:
  # 基础网络使用 bridge 驱动，用于容器间通信
  docker-net:
    name: ${COMPOSE_PROJECT_NAME}-net # 实际引用的 Docker 网络名
    driver: bridge # 使用 Docker 默认的 bridge 网络驱动
    attachable: true # 允许其他容器附加到此网络
    external: true

services:
  ruoyi-nacos:
    container_name: ruoyi-nacos
    image: nacos/nacos-server:v2.5.1
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_TOKEN: Gnj4Fp4OP9WJQie60IK2h8LL+wKXRM0PrhGcuW9uHhc=
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos

      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: ruoyi-mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: ry-config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true

      JVM_XMS: 512m
      JVM_XMX: 1g
    volumes:
      - ./tmp/nacos/logs/:/home/nacos/logs
      - ./config/nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - ruoyi-mysql
  # Redis 内存数据库 - 用于缓存和高速数据访问
  redis:
    image: redis:${REDIS_VERSION} # 官方Redis镜像
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: always # 总是重启策略
    environment:
      TZ: ${TZ} # 时区设置，从环境变量获取
    ports:
      - "${REDIS_PORT}:6379" # 暴露Redis默认端口
    volumes:
      - ${REDIS_DATA_PATH}:/data # RDB/AOF持久化数据
      - ${REDIS_LOGS_PATH}:/var/log/redis # 日志目录
    command: >
      sh -c "redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes"  # 启动带密码和AOF持久化
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"] # 使用密码检查
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docker-net

  # RedisInsight - Redis 可视化监控管理工具
  redisinsight:
    image: redislabs/redisinsight:1.14.0 # 官方RedisInsight镜像
    container_name: ${COMPOSE_PROJECT_NAME}-redisinsight
    restart: unless-stopped # 除非手动停止，否则自动重启
    ports:
      - "${REDIS_INSIGHT_PORT}:8001" # 暴露RedisInsight Web界面端口
    volumes:
      - ${REDIS_INSIGHT_DATA_PATH}:/data # 数据存储
    depends_on:
      redis:
        condition: service_healthy # 依赖redis服务健康状态
    networks:
      - docker-net

  # MySQL 关系型数据库 - 核心数据存储
  ruoyi-mysql:
    container_name: ${COMPOSE_PROJECT_NAME}-mysql
    image: mysql:${MYSQL_VERSION} # 官方MySQL镜像
    restart: always # 总是重启策略
    environment:
      TZ: ${TZ} # 时区设置，从环境变量获取
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # root密码（必须设置）
      MYSQL_SQL_MODE: NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES
      MYSQL_DATABASE: ${MYSQL_INITDB} # 初始化创建的数据库（可选）
      # MYSQL_USER: myuser                     # 创建新用户（可选）
      # MYSQL_PASSWORD: mypassword             # 新用户密码（可选）
    volumes:
      - ${MYSQL_DATA_PATH}:/var/lib/mysql # 数据文件存储
      # - ./mysql/conf.d:/etc/mysql/conf.d # 自定义配置
      - ${MYSQL_LOGS_PATH}:/var/log/mysql # 日志文件
      - ${MYSQL_INIT_SCRIPT}:/docker-entrypoint-initdb.d
    ports:
      - "${MYSQL_PORT}:3306" # 暴露MySQL默认端口
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - docker-net

  # phpMyAdmin - MySQL 数据库管理工具
  phpmyadmin:
    image: phpmyadmin/phpmyadmin # 官方phpMyAdmin镜像
    container_name: ${COMPOSE_PROJECT_NAME}phpmyadmin
    platform: linux/amd64 # 指定平台架构
    restart: always # 总是重启策略
    environment:
      TZ: Asia/Shanghai # 时区设置
      PMA_HOST: mysql # 连接的MySQL主机名
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # MySQL root密码
    ports:
      - "${PHPMYADMIN_PORT}:80" # 暴露Web界面端口
    networks:
      - docker-net
    depends_on:
      ruoyi-mysql:
        condition: service_healthy # 依赖mysql服务健康状态

  ruoyi-nginx:
    container_name: ruoyi-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/ruoyi/projects/ruoyi-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - ruoyi-gateway
    links:
      - ruoyi-gateway
    networks:
      - docker-net

  ruoyi-gateway:
    container_name: ruoyi-gateway
    build:
      context: ./ruoyi/gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - redis
    links:
      - redis
    networks:
      - docker-net

  ruoyi-auth:
    container_name: ruoyi-auth
    build:
      context: ./ruoyi/auth
      dockerfile: dockerfile
    ports:
      - "9200:9200"
    depends_on:
      - redis
    links:
      - redis
    networks:
      - docker-net

  ruoyi-modules-system:
    container_name: ruoyi-modules-system
    build:
      context: ./ruoyi/modules/system
      dockerfile: dockerfile
    ports:
      - "9201:9201"
    depends_on:
      - redis
      - ruoyi-mysql
    links:
      - redis
      - ruoyi-mysql
    networks:
      - docker-net

  ruoyi-modules-gen:
    container_name: ruoyi-modules-gen
    build:
      context: ./ruoyi/modules/gen
      dockerfile: dockerfile
    ports:
      - "9202:9202"
    depends_on:
      - ruoyi-mysql
    links:
      - ruoyi-mysql
    networks:
      - docker-net

  ruoyi-modules-job:
    container_name: ruoyi-modules-job
    build:
      context: ./ruoyi/modules/job
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    depends_on:
      - ruoyi-mysql
    links:
      - ruoyi-mysql
    networks:
      - docker-net

  ruoyi-modules-file:
    container_name: ruoyi-modules-file
    build:
      context: ./ruoyi/modules/file
      dockerfile: dockerfile
    ports:
      - "9300:9300"
    volumes:
      - ./ruoyi/uploadPath:/home/ruoyi/uploadPath
    networks:
      - docker-net

  ruoyi-visual-monitor:
    container_name: ruoyi-visual-monitor
    build:
      context: ./ruoyi/visual/monitor
      dockerfile: dockerfile
    ports:
      - "9100:9100"
    networks:
      - docker-net
